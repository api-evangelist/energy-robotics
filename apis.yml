aid: energy-robotics
name: Energy Robotics
description: >-
  Energy Robotics GmbH, now trading as Korial, is a Darmstadt, Germany enterprise
  AI platform (spun out of TU Darmstadt robotics research) for fully autonomous
  industrial operations. It is hardware-agnostic, unifying mixed-vendor robots,
  legged and tracked ground robots, drones, fixed cameras, and field sensors into
  a single governed AI operating layer that turns live telemetry into verified
  insight and orchestrated action across oil & gas, chemicals, power & utilities,
  and critical infrastructure. The platform spans four modules: Kore (the AI core
  with LLM, agentic workflows, embedded AI skills, and fleet/device supervision),
  Connect (an integration backbone exposing bidirectional governed APIs into ERP,
  EAM, SCADA, historians and ICS/OT systems), Recreate (digital twins and mission
  simulation), and Sustain (support, onboarding, and managed mission execution).
  Korial reports 1,000,000+ autonomous inspections, 100+ global deployments, and
  named customers including Shell, bp, Repsol, Petrobras, Pluspetrol, Chevron,
  E.ON, Evonik, BASF, and Merck. Rebranded from Energy Robotics GmbH on 4 May 2026.
